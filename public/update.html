<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Student</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>UPDATE STUDENT</h1><hr>
<a href="index.html">Home</a> |
<a href="list.html">List Students</a> |
<a href="listOne.html">List Required Student</a> |
<a href="insert.html">Insert Student</a> |
<a href="update.html">Update Student</a> |
<a href="delete.html">Delete Student</a>
<hr>
<form id="updateForm">
    Student ID<br><input type="number" id="id" required><br>
    Student Name<br><input type="text" id="name" required><br>
    Marks<br><input type="number" id="marks" required><br>
    Phone Number<br><input type="tel" id="phone" pattern="[0-9]{10}" maxlength="10" placeholder="10-digit phone number" required><br>
    Age<br><input type="number" id="age" min="1" max="120" required><br>
    <button type="submit">Update</button>
</form>
<button onclick="location.href='index.html'">Home Page</button>
<script>
document.getElementById("updateForm").addEventListener("submit", async function(event) {
    event.preventDefault();
    const id = document.getElementById("id").value;
    const student = {
        name: document.getElementById("name").value.trim(),
        marks: Number(document.getElementById("marks").value),
        phone: document.getElementById("phone").value.trim(),
        age: Number(document.getElementById("age").value)
    };
    try {
        const response = await fetch("/students/" + encodeURIComponent(id), {
            method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(student)
        });
        const message = await response.text();
        if (!response.ok) throw new Error(message);
        alert(message); location.href = "list.html";
    } catch (error) { alert(error.message || "Error updating student"); }
});
</script>
</body>
</html>
