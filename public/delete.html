<body>

<hr>
Student ID to Delete<br><input type="number" id="id" required><br>
<button onclick="deleteStudent()">Delete</button><br>
<button onclick="location.href='index.html'">Home Page</button>
<script>
async function deleteStudent() {
    const id = document.getElementById("id").value;
    if (!id) { alert("Please enter Student ID"); return; }
    if (!confirm("Are you sure you want to delete this student?")) return;
    try {
        const response = await fetch("/students/" + encodeURIComponent(id), { method: "DELETE" });
        const message = await response.text();
        if (!response.ok) throw new Error(message);
        alert(message); location.href = "list.html";
    } catch (error) { alert(error.message || "Error deleting student"); }
}
</script>
</body>
</html>
